name: Build & Release

# Every push to main builds, tests and publishes a new release. Installed
# copies of LaserPilot check these releases and offer the update.
#
# Releases are made only by this workflow. Don't create release tags by hand:
# the version in the tag must match the version built into the program, or
# installed copies would keep offering the same update.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Building needs read access only; the release job below asks for more.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content src/LaserPilot.App/LaserPilot.App.csproj)
          $base = ($csproj.Project.PropertyGroup | Where-Object { $_.VersionBase } | Select-Object -First 1).VersionBase
          $version = "$base.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      # Optional: lets installed copies update from this private repository
      # without each PC entering a token. Create a fine-grained token with
      # read-only "Contents" access to this repository and save it as the
      # repository secret LASERPILOT_UPDATE_TOKEN. Never committed, and only
      # built into the release builds from main.
      - name: Embed update token (if configured)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          UPDATE_TOKEN: ${{ secrets.LASERPILOT_UPDATE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_TOKEN)) {
            Write-Host "No LASERPILOT_UPDATE_TOKEN secret: users enter a token in Help > Update settings."
            exit 0
          }
          $bytes = [Text.Encoding]::UTF8.GetBytes($env:UPDATE_TOKEN.Trim())
          for ($i = 0; $i -lt $bytes.Length; $i++) { $bytes[$i] = $bytes[$i] -bxor 0x5A }
          [IO.File]::WriteAllBytes("src/LaserPilot.App/update.key", $bytes)
          Write-Host "Update token embedded."

      - name: Build
        run: dotnet build LaserPilot.slnx -c Release -p:BuildNumber=${{ github.run_number }}

      - name: Test
        run: dotnet test LaserPilot.slnx -c Release --no-build -p:BuildNumber=${{ github.run_number }}

      - name: Publish portable exe (self-contained, single file)
        run: >
          dotnet publish src/LaserPilot.App -c Release -r win-x64
          -p:PublishSingleFile=true -p:SelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:BuildNumber=${{ github.run_number }}
          -o publish

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path publish/LaserPilot.exe -DestinationPath LaserPilot-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaserPilot-win-x64
          path: LaserPilot-win-x64.zip

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and attach the build
    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: LaserPilot-win-x64

      - name: Write release notes
        shell: pwsh
        run: |
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $lines = @()
          foreach ($c in $event.commits) {
            $first = ($c.message -split "`n")[0].Trim()
            if ($first -and $first -notmatch '^Merge ') { $lines += "- $first" }
          }
          if ($lines.Count -eq 0 -and $event.head_commit) { $lines += "- " + ($event.head_commit.message -split "`n")[0].Trim() }
          if ($lines.Count -eq 0) { $lines += "- Maintenance build" }
          $notes = "What's new:`n" + ($lines -join "`n")
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Write-Host $notes

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: LaserPilot ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: LaserPilot-win-x64.zip
          make_latest: true
